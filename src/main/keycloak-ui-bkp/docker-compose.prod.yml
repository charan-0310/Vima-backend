version: "3.9"

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: keycloak-prod
    command:
      - start
      - --proxy-headers=xforwarded
      - --hostname-strict=false
      - --http-enabled=true
    environment:
      KC_DB: postgres

      KC_DB_URL: jdbc:postgresql://database-1.cncausigszky.ap-south-1.rds.amazonaws.com:5432/keycloak
      KC_DB_USERNAME: vima_user
      KC_DB_PASSWORD: REDACTED

      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123

      KC_HOSTNAME_STRICT: false

    expose:
      - "8080"

    volumes:
      - ./themes:/opt/keycloak/themes
      - ./providers:/opt/keycloak/providers

    restart: unless-stopped

  nginx:
    image: nginx:stable
    container_name: keycloak-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ../certs/server.crt:/etc/nginx/certs/server.crt
      - ../certs/server.key:/etc/nginx/certs/server.key
    depends_on:
      - keycloak
    restart: unless-stopped
