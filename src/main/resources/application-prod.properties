spring.application.name=vimaadmin
server.port = 7219
server.servlet.context-path=/prod

# DataSource settings
# F-13: SSL enforced via sslmode=verify-full + RDS CA bundle
spring.datasource.url=jdbc:postgresql://database-1.cncausigszky.ap-south-1.rds.amazonaws.com:5432/vima_prod?ssl=true&sslmode=verify-full&sslrootcert=/etc/ssl/certs/rds-combined-ca-bundle.pem
spring.datasource.username=${VIMA_DB_USERNAME}
spring.datasource.password=${VIMA_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

server.forward-headers-strategy=native
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=None

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# ✅ FIX: Increase Hibernate query plan cache to prevent re-parsing JPQL/HQL queries
# This reduces ANTLR usage for query parsing (reduces 20% of ANTLR memory leak)
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=128

# Javers Configuration for Entity Auditing (Diff Only Mode)
# Using javers-core (no Spring Boot starter) - diff calculations only, no persistence

jwt.securitykey=${VIMA_JWT_SIGNING_KEY}
# 15 minutes for access token (in ms)
jwt.expiration=900000

# 7 days for refresh token (in ms)
jwt.refreshexpiration=604800000

#Swagger
# Springdoc OpenAPI Caching Configuration
# Prevents ANTLR re-parsing on each request to reduce memory leaks
# Disable Springdoc in production if not needed to prevent ANTLR usage
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# If you need Swagger in production, enable caching:
# springdoc.api-docs.enabled=true
# springdoc.api-docs.path=/v3/api-docs
# springdoc.cache.disabled=false
# springdoc.swagger-ui.enabled=true
# springdoc.swagger-ui.path=/swagger-ui.html
# springdoc.swagger-ui.operations-sorter=alpha
# springdoc.swagger-ui.tags-sorter=alpha
# springdoc.swagger-ui.disable-swagger-default-url=true

auth.type=Bearer Authentication

# OAuth2 Client Configuration for Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Optional: You can override Google's default provider settings
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo

# Optional: Redirect URI (usually handled automatically, but can be set)
# spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

logging.level.org.springframework=INFO

# OAuth2 Resource Server Configuration for Keycloak JWT Validation
# This backend only validates JWT tokens issued by Keycloak.
# React performs login and token exchange - no login endpoints or callback endpoints are required here.
# JWT tokens are validated against the configured issuer-uri using Spring Security OAuth2 Resource Server.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.auth-server-url}/realms/${keycloak.realm}

# CORS Configuration (F-05 hardened)
cors.allowed-origins=https://www.vimainsurance.com,https://app.vimainsurance.com,capacitor://localhost,ionic://localhost
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
# Include X-Organization-ID: SPA sends it for HR / org-scoped APIs (TenantFilter); omitting it breaks preflight.
cors.allowed-headers=Authorization,Content-Type,X-Requested-With,X-Correlation-Id,X-CSRF-Token,Accept,Origin,X-Organization-ID
cors.allow-credentials=true

redirect.url=https://www.vimainsurance.com
# F-22: explicit allowlist of post-login redirect targets (comma separated)
redirect.allowed-targets=https://www.vimainsurance.com,https://app.vimainsurance.com

# F-04: Global rate limiting (per-IP, in-memory). Backed by Bucket4j + Caffeine.
ratelimit.enabled=true
ratelimit.default.requests-per-min=120
# F-16: tightened from 10 -> 5 because the legacy login endpoints no longer have CAPTCHA.
ratelimit.auth.requests-per-min=5
ratelimit.enrollment.requests-per-min=20
# Cap on distinct IP buckets held in memory; older entries evicted on overflow.
ratelimit.cache.max-entries=50000
ratelimit.cache.expire-after-access-minutes=10

# F-16: Per-username lockout on legacy login flows.
security.login.lockout.max-failures=5
security.login.lockout.window-minutes=15

# Endorsement Scheduler Configuration
# Enable/disable the scheduler for automatic endorsement schedule confirmation
endorsement.scheduler.enabled=true
# Cron expression: "0 * * * * ?" = every minute
# Format: second minute hour day month weekday
# Examples:
#   "0 * * * * ?" - every minute
#   "0 0 * * * ?" - every hour
#   "0 0 0 * * ?" - every day at midnight
#   "0 0 0 * * MON" - every Monday at midnight
endorsement.scheduler.cron-expression=0 0 19 * * ?
# Initial delay in milliseconds before first execution (default: 60000 = 1 minute)
endorsement.scheduler.initial-delay-ms=60000

# Enrollment Reminder Scheduler (daily 9 AM IST = 03:30 UTC - sends reminders per window config, final reminder 1 day before expiry)
enrollment.reminder-scheduler.enabled=true
# Cron (UTC): second minute hour day month weekday. 0 30 3 * * * = 03:30 UTC = 9:00 AM IST
enrollment.reminder-scheduler.cron-expression=0 30 3 * * *

# Enrollment Window Expiry Scheduler (marks SCHEDULED windows as EXPIRED when end_date passes)
enrollment.window-expiry-scheduler.enabled=true
# Cron (UTC): second minute hour day month weekday. 0 0 0 * * * = midnight UTC = 5:30 AM IST
enrollment.window-expiry-scheduler.cron-expression=0 0 0 * * *

# Demo setup scheduler
demo.cleanup-scheduler.enabled=false

# Email Configuration
# In prod, mail.provider=ses so the SMTP path in EmailServiceImpl is unreachable.
# The settings below remain only because Spring's JavaMailSender bean wiring still
# references them. Username + password default to empty so Spring boot does not fail
# if the env vars are not set; sending via SMTP in prod would fail loudly at runtime
# instead of silently using stale credentials.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
mail.provider=ses

# SES Configuration (switch provider with MAIL_PROVIDER=ses)
# F-01/F-02: leave access-key/secret-key blank to use IAM role (DefaultCredentialsProvider chain).
# Override via env only when running outside EC2/ECS without an instance role.
aws.ses.region=ap-south-1
aws.ses.access-key=${AWS_SES_ACCESS_KEY:}
aws.ses.secret-key=${AWS_SES_SECRET_KEY:}
aws.ses.from-email=no-reply@vimainsurance.com
aws.ses.configuration-set=my-first-configuration-set
aws.sqs.mail-queue.listener-enabled=true

# Email Application Settings
app.email.from-name=Vima Insurance
app.email.enabled=true

# Application Base URL for email links (enrollment magic links, etc.)
app.base-url=https://app.vimainsurance.com

# F-01/F-02: leave access-key/secret-key blank to use IAM role.
aws.s3.access-key=${AWS_S3_ACCESS_KEY:}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:}
aws.s3.region=ap-south-1
aws.s3.bucket-name=vimainsurance-prod
aws.s3.endpoint=
aws.s3.presigned-url-expiration=300
aws.s3.server-side-encryption.kms-key-id=arn:aws:kms:ap-south-1:467830606748:key/a8ac0108-bbd1-41c8-af13-69a55a93ba69

# Document Upload Configuration
document.upload.allowed-extensions=.pdf,.jpg,.jpeg,.png,.pptx,.ppt,.csv,.xlsx,.xls,.docx,.doc
document.upload.allowed-mime-types=application/pdf,image/jpeg,image/jpg,image/png,image/gif,image/bmp,image/tiff,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.ms-powerpoint,text/csv
document.upload.max-file-size=52428800
document.upload.max-image-size=52428800

# ==== 50 MB upload limit ====
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Allow Tomcat to handle large request bodies
server.tomcat.max-swallow-size=-1

slack.sendmessage=true

# Enrollment Token Security
enrollment.token.expiry.days=7
enrollment.token.rate-limit.enabled=true
enrollment.token.rate-limit.max-requests=3
enrollment.token.rate-limit.period-minutes=1

# Keycloak Configuration (UAT)
keycloak.auth-server-url=https://api.vimainsurance.com
keycloak.realm=vima-prod
keycloak.client-id=vima-backend
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
keycloak.service.client-id=vima-service
keycloak.service.client-secret=${KEYCLOAK_SERVICE_CLIENT_SECRET}
