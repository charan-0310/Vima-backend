# OAuth2 Resource Server - JWT Validation (UAT: Keycloak)
# JWT validation uses Keycloak.
# JWT tokens are validated against the configured issuer-uri using Spring Security OAuth2 Resource Server.
# Keycloak realm URL - adjust keycloak.auth-server-url and keycloak.realm if needed (e.g. localhost:8180 for local Keycloak)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.auth-server-url}/realms/${keycloak.realm}
# Optional: explicit JWK Set URI (usually derived from issuer-uri)
# spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${keycloak.auth-server-url}/realms/${keycloak.realm}/protocol/openid-connect/certs

