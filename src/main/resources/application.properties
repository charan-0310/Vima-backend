# Spring profile is set via SPRING_PROFILES_ACTIVE environment variable
# Default to dev if not specified (for local development)
# In Docker, this is set via docker-compose.yml environment variables
spring.profiles.active=local
# vima.aes.key=0123456789abcdef0123456789abcdef4

# CSV headers in positional order (employeeId, firstName, lastName, email, phone,
# designation, dateOfJoining, status). Adjust values or add vendor-specific headers.
csv.deals.headers=employee id,first name,last name,email,phone,designation,date of joining,status
# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true
spring.flyway.sql-migration-prefix=V
spring.flyway.sql-migration-separator=__
spring.flyway.sql-migration-suffixes=.sql
spring.flyway.encoding=UTF-8
spring.flyway.schemas=public
spring.flyway.table=flyway_schema_history
# Optional: if using a dedicated DB user for migrations, set below
# spring.flyway.user=flyway_user
# spring.flyway.password=secret

# Enrollment reminder scheduler (override per profile: application-{profile}.properties)
# enrollment.reminder-scheduler.enabled=true
# enrollment.reminder-scheduler.cron-expression=0 0 9 * * *

# Enrollment window expiry scheduler (marks SCHEDULED windows as EXPIRED when end_date passes)
# enrollment.window-expiry-scheduler.enabled=true
# enrollment.window-expiry-scheduler.cron-expression=0 0 0 * * *

# SQS mail queue (AWSpring). Set aws.sqs.mail-queue.listener-enabled=true in deployed profiles; false for local without the queue.
aws.sqs.mail-queue=Vima-Mail-Queue
aws.sqs.mail-queue.listener-enabled=false
spring.cloud.aws.region.static=${aws.ses.region:ap-south-1}
# Credentials intentionally NOT set here — Spring Cloud AWS falls back to the
# DefaultCredentialsProvider chain (EC2 instance role, env vars, ~/.aws/credentials).
# Setting these to empty strings (e.g. when AWS_SES_ACCESS_KEY is unset) causes
# Spring Cloud AWS to pick StaticCredentialsProvider with empty values and SQS/SES
# fail at boot. If you really need static keys for a non-EC2 host, export
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (the standard chain reads those).