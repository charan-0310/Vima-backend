<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title}">Endorsement uploaded</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.5; color: #111;">
<p>Hello,</p>
<p>
    <strong th:text="${uploadedByName}">HR</strong> uploaded an endorsement for
    <strong th:text="${organizationName}">Organization</strong>
    <span th:if="${endorsementType != null and !endorsementType.isEmpty()}">
        (<span th:text="${endorsementType}">TYPE</span>)
    </span>.
</p>
<p th:if="${hasSelfEmployeeIds != null and hasSelfEmployeeIds}">
    Primary employee IDs (Self) in this upload:
    <span th:text="${selfEmployeeIdsText}">ID1, ID2</span>
    <span th:if="${selfEmployeeIdsRemainingCount != null and selfEmployeeIdsRemainingCount > 0}">
        (and <span th:text="${selfEmployeeIdsRemainingCount}">0</span> more)
    </span>.
</p>
<p>
    <a th:href="${deepLinkUrl}" th:text="${deepLinkUrl}">Open in Vima</a>
</p>
<p style="color:#666;font-size:12px;">This is an automated message from Vima.</p>
</body>
</html>
