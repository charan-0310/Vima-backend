<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title}">Claim query raised</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.5; color: #111;">
<p>Hello,</p>
<p>
    A query was raised on claim <strong th:text="${claimNumber}">CLM</strong>.
</p>
<p th:if="${queryText != null and !queryText.isEmpty()}">
    Query: <span th:text="${queryText}">Please provide additional details.</span>
</p>
<p>
    <a th:href="${deepLinkUrl}" th:text="${deepLinkUrl}">Open claim</a>
</p>
<p style="color:#666;font-size:12px;">This is an automated message from Vima.</p>
</body>
</html>
