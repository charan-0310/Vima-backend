<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll Deduction Report</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; background-color: #f4f6f8; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; }
        .header { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; padding: 32px 24px; text-align: center; }
        .header h1 { font-size: 24px; margin: 0 0 8px 0; }
        .content { padding: 32px 24px; }
        .content p { margin: 0 0 16px 0; }
        table { width: 100%; border-collapse: collapse; margin: 16px 0; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; font-weight: 600; color: #475569; }
        .footer { padding: 20px 24px; background: #f8fafc; font-size: 12px; color: #64748b; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Payroll Deduction Report</h1>
            <p th:text="${#strings.isEmpty(companyName) ? 'VIMA Insurance Brokers Pvt. Ltd' : companyName}">Company Name</p>
        </div>
        <div class="content">
            <p>Please find attached the payroll deduction report for <strong th:text="${reportMonth}">Report month</strong>.</p>
            <table>
                <tr><th>Total employer cost</th><td th:text="${totalEmployerCost}">0</td></tr>
                <tr><th>Total employee cost</th><td th:text="${totalEmployeeCost}">0</td></tr>
                <tr><th>Employee count</th><td th:text="${employeeCount}">0</td></tr>
            </table>
            <p style="font-size: 14px; color: #64748b;">Attachment: <span th:text="${attachmentFileName}">report.xlsx</span></p>
        </div>
        <div class="footer">
            <p th:text="${#strings.isEmpty(companyName) ? 'VIMA Insurance Brokers Pvt. Ltd' : companyName}">Company Name</p>
        </div>
    </div>
</body>
</html>
