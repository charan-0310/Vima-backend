<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:fragment="emailLayout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Claim update — Vima Insurance</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #1a1a1a; margin: 0; padding: 0; background-color: #f3f4f6;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #f3f4f6;">
        <tr>
            <td style="padding: 24px 16px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="max-width: 560px; margin: 0 auto; background-color: #ffffff; border-radius: 12px;">
                    <tr>
                        <td style="padding: 24px 24px 16px 24px;">
                            <img src="https://vimainsurance.com/assets/vima-logo-main.DiciI4hf.png" alt="Vima Insurance" width="180" height="58" style="height: 58px; width: 180px; max-width: 100%; display: block; border: 0;">
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 0 24px 20px 24px;">
                            <p style="font-size: 16px; color: #1a1a1a; margin: 0 0 8px 0;">Hello <strong th:text="${recipientName}">there</strong>,</p>
                            <p style="font-size: 16px; color: #525252; margin: 0; line-height: 1.5;" th:text="${message}">Update message.</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 0 24px 24px 24px;">
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0;">
                                <tr>
                                    <td style="padding: 20px;">
                                        <p style="font-size: 12px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 12px 0;">Claim summary</p>
                                        <p style="margin: 0 0 8px 0; font-size: 13px; color: #64748b;">Organization <span style="color: #1a1a1a; font-weight: 600;" th:text="${organizationName}">-</span></p>
                                        <p style="margin: 0 0 8px 0; font-size: 13px; color: #64748b;">Claim number <span style="color: #1a1a1a; font-weight: 600;" th:text="${claimNumber != null ? claimNumber : claimId}">-</span></p>
                                        <p th:if="${memberName != null and !#strings.isEmpty(memberName)}" style="margin: 0 0 8px 0; font-size: 13px; color: #64748b;">Member <span style="color: #1a1a1a;" th:text="${memberName}">-</span></p>
                                        <p th:if="${hospitalName != null and !#strings.isEmpty(hospitalName)}" style="margin: 0 0 8px 0; font-size: 13px; color: #64748b;">Hospital <span style="color: #1a1a1a;" th:text="${hospitalName}">-</span></p>
                                        <p th:if="${claimAmountFormatted != null and !#strings.isEmpty(claimAmountFormatted)}" style="margin: 0 0 8px 0; font-size: 13px; color: #64748b;">Claim amount <span style="color: #1a1a1a;" th:text="${claimAmountFormatted}">-</span></p>
                                        <p th:if="${queryText != null and !#strings.isEmpty(queryText)}" style="margin: 0 0 8px 0; font-size: 13px; color: #64748b;">Query <span style="color: #1a1a1a; white-space: pre-wrap;" th:text="${queryText}">-</span></p>
                                        <p th:if="${responseText != null and !#strings.isEmpty(responseText)}" style="margin: 0 0 8px 0; font-size: 13px; color: #64748b;">Response <span style="color: #1a1a1a; white-space: pre-wrap;" th:text="${responseText}">-</span></p>
                                        <p style="margin: 16px 0 0 0;">
                                            <span th:style="|display: inline-block; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; background-color: ${statusBadgeColor != null ? statusBadgeColor : '#e2e8f0'}; color: #1a1a1a;|" th:text="${statusBadge}">Status</span>
                                        </p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 0 24px 32px 24px;">
                            <a th:href="${deepLinkUrl}" href="#" style="display: inline-block; background-color: #1e40af; color: #ffffff !important; padding: 14px 28px; text-decoration: none; border-radius: 8px; font-size: 15px; font-weight: 600;">View claim</a>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 0 24px 24px 24px; font-size: 12px; color: #9ca3af; text-align: center;">
                            <p style="margin: 0;">© 2026 Vima Insurance · Chennai, India</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
