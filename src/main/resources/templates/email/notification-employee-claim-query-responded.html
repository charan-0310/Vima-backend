<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title}">Claim query responded</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.5; color: #111;">
<p>Hello,</p>
<p>
    A query response was submitted for claim <strong th:text="${claimNumber}">CLM</strong>.
</p>
<p th:if="${responseText != null and !responseText.isEmpty()}">
    Response: <span th:text="${responseText}">Response details</span>
</p>
<p>
    <a th:href="${deepLinkUrl}" th:text="${deepLinkUrl}">Open claim</a>
</p>
<p style="color:#666;font-size:12px;">This is an automated message from Vima.</p>
</body>
</html>
