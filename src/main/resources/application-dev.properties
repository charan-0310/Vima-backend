spring.application.name=vimaadmin
server.port = 7219
server.servlet.context-path=/
# DataSource settings
spring.datasource.url=jdbc:postgresql://localhost:5432/vimaadmin
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
server.forward-headers-strategy=framework

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Batch insert optimization for large CSV imports
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.generate_statistics=false
# ✅ FIX: Increase Hibernate query plan cache to prevent re-parsing JPQL/HQL queries
# This reduces ANTLR usage for query parsing (reduces 20% of ANTLR memory leak)
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=128


jwt.securitykey = REDACTED
# 15 minutes for access token (in ms)
jwt.expiration=900000

# 7 days for refresh token (in ms)
jwt.refreshexpiration=604800000

#Swagger
# Springdoc OpenAPI Caching Configuration
# Prevents ANTLR re-parsing on each request to reduce memory leaks
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.cache.disabled=false
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
# Disable auto-reload to prevent re-parsing
springdoc.swagger-ui.disable-swagger-default-url=true

auth.type=Bearer Authentication

# OAuth2 Client Configuration for Google
spring.security.oauth2.client.registration.google.client-id=REDACTED_GOOGLE_OAUTH_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=REDACTED_GOOGLE_OAUTH_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Optional: You can override Google's default provider settings
