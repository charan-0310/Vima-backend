# Test configuration for Spring Boot tests
spring.application.name=vimaadmin-test

# Disable Flyway for tests
spring.flyway.enabled=false

# JWT configuration (required for context loading)
jwt.securitykey=REDACTED
jwt.expiration=900000
jwt.refreshexpiration=604800000

# Authentik configuration (required for context loading, but will be mocked in tests)
authentik.url=http://localhost:9000
authentik.token=test-token

# OAuth2 Resource Server (required for context loading)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000/application/o/vima/

# Disable Swagger for tests
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# reCAPTCHA (required for context loading)
google.recaptcha.secret=test-secret
google.recaptcha.site=test-site

# Zoho CRM (required for context loading)
zoho.crm.client-id=test-client-id
zoho.crm.client-secret=test-client-secret
zoho.crm.refresh-token=test-refresh-token
zoho.crm.user-email=test@example.com
zoho.crm.redirect-url=http://localhost:8080/callback

# CORS
cors.allowed-origins=http://localhost:8080
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Logging
logging.level.root=WARN
logging.level.com.vimainsurance.vimaadmin=INFO
