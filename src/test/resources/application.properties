# Test configuration for Spring Boot tests
spring.application.name=vimaadmin-test
spring.profiles.active=local
# Disable Flyway for tests
spring.flyway.enabled=false

# JWT configuration (required for context loading)
jwt.securitykey=REDACTED
jwt.expiration=900000
jwt.refreshexpiration=604800000

# Authentik configuration (required for context loading, but will be mocked in tests)
authentik.url=http://localhost:9000
authentik.token=test-token

# OAuth2 Resource Server (required for context loading)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000/application/o/vima/

# Disable Swagger for tests
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# reCAPTCHA (required for context loading)
google.recaptcha.secret=test-secret
google.recaptcha.site=test-site

# Zoho CRM (required for context loading)
zoho.crm.client-id=test-client-id
zoho.crm.client-secret=test-client-secret
zoho.crm.refresh-token=test-refresh-token
zoho.crm.user-email=test@example.com
zoho.crm.redirect-url=http://localhost:8080/callback

# CORS
cors.allowed-origins=http://localhost:8080
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Email Configuration (required for context loading)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=test-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Email Application Settings
app.email.from-name=Vima Insurance
app.base-url=http://localhost:7219

# F-22 redirect allowlist (Keycloak action emails)
redirect.url=http://localhost:7219
redirect.allowed-targets=http://localhost:7219,http://localhost:5173,http://localhost:8080

# F-09 enrollment magic-link HMAC (tests only)
app.enrollment-token-secret=test-enrollment-token-secret-v1

# AWS S3 Configuration (required for context loading)
aws.s3.access-key=test-access-key
aws.s3.secret-key=test-secret-key
aws.s3.region=ap-south-1
aws.s3.bucket-name=test-bucket
aws.s3.endpoint=
aws.s3.presigned-url-expiration=300

# SQS (avoid AWS/network during tests)
aws.sqs.mail-queue.listener-enabled=false
spring.cloud.aws.sqs.enabled=false

# Endorsement Scheduler Configuration
endorsement.scheduler.enabled=false

# Logging
logging.level.root=WARN
logging.level.com.vimainsurance.vimaadmin=INFO
