name: Build & Deploy to EC2 UAT

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java with Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build jar with Maven
        run: mvn clean verify
      - name: Debug paths
        run: |
          echo "Current directory: $(pwd)"
          echo "Listing target directory:"
          ls -lh target || echo "❌ No target folder found"
          echo "Listing home directory:"
          sudo chown -R ubuntu:ubuntu /home/ubuntu/vima-app-deployment
          sudo chmod -R 755 /home/ubuntu/vima-app-deployment
          ls -lh ~
      - name: Move jar to deploy directory
        run: |
          JAR_FILE=$(ls target/*.jar | head -n 1)
          echo "Jar built: $JAR_FILE"
          # Ensure dev directory structure exists
          mkdir -p /home/ubuntu/vima-app-deployment/api-dev/artifact
          cp "$JAR_FILE" /home/ubuntu/vima-app-deployment/api-dev/artifact/vimaadmin-0.0.1-SNAPSHOT.jar
          echo "✅ JAR moved to ~/vima-app-deployment/api-dev/artifact/vimaadmin-0.0.1-SNAPSHOT.jar"
      - name: Restart Docker Compose service (Dev)
        run: |
          cd ~/vima-app-deployment
          if [ ! -f api-dev/entrypoint.sh ]; then
            printf '%s\n' '#!/usr/bin/env sh' 'set -e' 'exec java -jar /app/app.jar' > api-dev/entrypoint.sh
            chmod +x api-dev/entrypoint.sh
            echo "✅ Created missing api-dev/entrypoint.sh"
          fi
          docker compose up -d --build vima-api-dev
          echo "✅ Docker Compose service 'vima-api-dev' restarted for DEV environment"    
