name: Build & Deploy to EC2

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java with Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install Zoho SDK JAR locally
        run: |
            mvn install:install-file \
            -Dfile=lib/zohocrmsdk-5-0-6.0.0.jar \
            -DgroupId=com.zoho.crm \
            -DartifactId=zohocrmsdk-5-0 \
            -Dversion=6.0.0 \
            -Dpackaging=jar
            
      - name: Build jar with Maven
        run: mvn clean package -DskipTests

      - name: Move jar to deploy directory
        run: |
          JAR_FILE=$(ls target/*.jar | head -n 1)
          echo "Jar built: $JAR_FILE"
          mkdir -p ~/app
          cp "$JAR_FILE" ~/vima-app-deployment/api-dev/artifact/vimaadmin-0.0.1-SNAPSHOT.jar
          echo "✅ JAR moved to ~/vima-app-deployment/api-dev/artifact/vimaadmin-0.0.1-SNAPSHOT.jar"
