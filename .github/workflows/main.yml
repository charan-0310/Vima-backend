name: Build & Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java with Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build jar with Maven
        run: mvn clean verify
      - name: Debug paths
        run: |
          echo "Current directory: $(pwd)"
          echo "Listing target directory:"
          ls -lh target || echo "❌ No target folder found"
          echo "Listing home directory:"
          sudo chown -R ubuntu:ubuntu /home/ubuntu/vima-app-deployment
          sudo chmod -R 755 /home/ubuntu/vima-app-deployment
          ls -lh ~
      - name: Move jar to deploy directory
        run: |
          JAR_FILE=$(ls target/*.jar | head -n 1)
          echo "Jar built: $JAR_FILE"
          # Ensure prod directory structure exists
          mkdir -p /home/ubuntu/vima-app-deployment/api/artifact
          cp "$JAR_FILE" /home/ubuntu/vima-app-deployment/api/artifact/vimaadmin-0.0.1-SNAPSHOT.jar
          echo "✅ JAR moved to ~/vima-app-deployment/api/artifact/vimaadmin-0.0.1-SNAPSHOT.jar"

      - name: Refresh secrets from AWS Secrets Manager (Prod)
        # F-01: pulls vima/prod/backend into /etc/vima/prod.env, which docker-compose
        # reads via env_file. The loader script must already exist on the host
        # (one-time setup — see docs/prd/audit/IRDAI_P0_Manual_Env_Todo.md §1e).
        run: |
          if [ ! -x /usr/local/bin/load-vima-secrets.sh ]; then
            echo "❌ /usr/local/bin/load-vima-secrets.sh not found on host."
            echo "   One-time setup is required before this workflow can deploy."
            echo "   Follow docs/prd/audit/IRDAI_P0_Manual_Env_Todo.md §1e."
            exit 1
          fi
          sudo /usr/local/bin/load-vima-secrets.sh
          echo "✅ Secrets refreshed into /etc/vima/prod.env"

      - name: Restart Docker Compose service (Prod)
        run: |
          cd ~/vima-app-deployment
          if [ ! -f api/entrypoint.sh ]; then
            printf '%s\n' '#!/usr/bin/env sh' 'set -e' 'exec java -jar /app/app.jar' > api/entrypoint.sh
            chmod +x api/entrypoint.sh
            echo "✅ Created missing api/entrypoint.sh"
          fi
          docker compose up -d --build vima-api
          echo "✅ Docker Compose service 'vima-api' restarted for PROD environment"
